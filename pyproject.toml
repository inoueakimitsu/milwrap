[project]
name = "milwrap"
version = "0.2.0"
description = "milwrap - multiple instane meta-learner that can use any supervised-learning algorithms."
authors = [{ name = "Akimitsu Inoue", email = "akimitsu.inoue@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
keywords = ["machine learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/inoueakimitsu/milwrap"
Repository = "https://github.com/inoueakimitsu/milwrap"

[dependency-groups]
dev = [
    "flake8",
    "pytest",
    "mypy",
    "sphinx",
    "sphinx-rtd-theme",
    "pre-commit>=3.3.3,<4",
    "pytest-cov>=4.1.0,<5",
    "commitizen>=3.6.0,<4",
    "pdoc3>=0.11.1,<0.12",
    "ruff>=0.4.5,<0.5",
]

[tool.hatch.build.targets.sdist]
include = ["milwrap"]

[tool.hatch.build.targets.wheel]
include = ["milwrap"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
update_changelog_on_bump = true
major_version_zero = true
